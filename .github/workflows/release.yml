name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v2.0.1). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: python build/build.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        env:
          MYAPP_VERSION: ${{ steps.version.outputs.version }}
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%MYAPP_VERSION% installer\installer.iss'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonosDiscordPresence-${{ steps.version.outputs.tag }}
          path: |
            dist/SonosDiscordPresence.exe
            dist/installer/SonosDiscordPresence-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sonos Discord Presence ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/SonosDiscordPresence.exe
            dist/installer/SonosDiscordPresence-Setup.exe
